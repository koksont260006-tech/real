<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>함께 짜는 3박4일 여행 보드</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2a2a;--sub:#6b7777;--ac:#1f8a70;--ac2:#e8f4f0;--bd:#e2e0d8;--warn:#d9602a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1c2522;--tx:#eef3f1;--sub:#93a39e;--ac:#3fbf9f;--ac2:#1e3a33;--bd:#2c3a36;--warn:#f09a5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121816;--card:#1c2522;--tx:#eef3f1;--sub:#93a39e;--ac:#3fbf9f;--ac2:#1e3a33;--bd:#2c3a36;--warn:#f09a5c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 48px}
h1{font-size:19px;margin:4px 0}
h2{font-size:15px;margin:0 0 6px}
.sm{font-size:12px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;padding:8px 14px;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:9px 14px;font-size:14px}
.btn.o{background:var(--ac2);color:var(--ac)}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd);font-size:14px}
.slot:first-of-type{border-top:0}
.slot a{color:var(--ac);text-decoration:none;font-size:13px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--ac2);color:var(--ac);margin-right:4px}
.x{border:0;background:none;color:var(--sub);font-size:16px;padding:2px 6px}
input,select{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px;font:inherit;font-size:14px;min-width:0}
input{flex:1;width:100%}
select{padding:7px}
.dayhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.dayhd a{font-size:12px;color:var(--ac);text-decoration:none;border:1px solid var(--ac);border-radius:12px;padding:3px 9px}
.bal{font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<h1>🗺 함께 짜는 3박4일 여행 보드</h1>
<p class="sm">지역을 고르면 일정이 만들어지고, 장소마다 구글지도 링크가 붙어요.</p>
<div class="chips" id="regions"></div>
<div id="app"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const DATA={
"서울":{d:[["경복궁","북촌한옥마을","광장시장"],["국립중앙박물관","N서울타워","이태원 맛집거리"],["여의도 한강공원","더현대 서울","성수동 카페거리"],["익선동 한옥거리","창덕궁","인사동 쌈지길"]],
c:["서울숲","롯데월드타워 서울스카이","동대문디자인플라자","망원시장","홍대 걷고싶은거리","낙산공원"]},
"강원도":{d:[["속초 중앙시장","속초해수욕장","아바이마을"],["설악산 케이블카","낙산사","양양 서피비치"],["강릉 안목해변 커피거리","경포대","강릉 중앙시장"],["오죽헌","정동진역","대관령 양떼목장"]],
c:["하슬라아트월드","삼척 장호항","춘천 소양강 스카이워크","남이섬","정선 레일바이크","평창 월정사"]},
"제주도":{d:[["성산일출봉","섭지코지","광치기해변"],["우도","만장굴","비자림"],["협재해수욕장","한림공원","오설록 티뮤지엄"],["동문재래시장","용두암","도두봉 무지개해안도로"]],
c:["카멜리아힐","사려니숲길","새별오름","주상절리대","아쿠아플라넷 제주","어리목 탐방로"]}};
const MB=["나","지민","도윤","서연"];
let region=null,plan=[],cand=[],exp=[];
function q(n){return encodeURIComponent(n+" "+region)}
function pin(n){return "https://www.google.com/maps/search/?api=1&query="+q(n)}
function route(arr){return "https://www.google.com/maps/dir/"+arr.map(q).join("/")}
Object.keys(DATA).forEach(r=>{const b=document.createElement("button");b.className="chip";b.textContent=r;b.dataset.r=r;b.onclick=()=>pick(r);$("#regions").appendChild(b)});
function pick(r){region=r;plan=DATA[r].d.map(d=>[...d]);cand=DATA[r].c.map((n,i)=>({n,v:[3,2,2,1,1,0][i]}));exp=[];
document.querySelectorAll("#regions .chip").forEach(c=>c.classList.toggle("on",c.dataset.r===r));render()}
function render(){
if(!region){$("#app").innerHTML=`<div class="card sm">위에서 서울, 강원도, 제주도 중 하나를 선택해 주세요.</div>`;return}
let h="";
plan.forEach((d,i)=>{h+=`<div class="card"><div class="dayhd"><h2>Day ${i+1}</h2>${d.length>1?`<a href="${route(d)}" target="_blank" rel="noopener">전체 경로 📍</a>`:""}</div>`;
h+=d.map((n,j)=>`<div class="slot"><span><span class="tag">${["오전","오후","저녁"][j]||"추가"}</span>${n}</span><span><a href="${pin(n)}" target="_blank" rel="noopener">지도 📍</a><button class="x" onclick="rm(${i},${j})" aria-label="삭제">✕</button></span></div>`).join("")||`<p class="sm">비어 있어요. 아래 후보에서 담아 보세요.</p>`;
h+="</div>"});
const sorted=cand.map((c,i)=>({...c,i})).sort((a,b)=>b.v-a.v);
h+=`<div class="card"><h2>📌 장소 후보 투표</h2><p class="sm">투표가 많은 순서로 정렬돼요. 마음에 들면 일정에 담아 보세요.</p>`;
h+=sorted.map(c=>`<div class="slot"><span>${c.n}<br><a href="${pin(c.n)}" target="_blank" rel="noopener">구글지도에서 보기 📍</a></span><span class="row"><button class="chip" onclick="vt(${c.i})">👍 ${c.v}</button><select id="s${c.i}" aria-label="담을 날짜">${[1,2,3,4].map(d=>`<option value="${d-1}">Day ${d}</option>`).join("")}</select><button class="btn o" onclick="add(${c.i})">담기</button></span></div>`).join("")||`<p class="sm">모든 후보를 일정에 담았어요.</p>`;
h+=`<div class="row" style="margin-top:10px"><input id="np" placeholder="후보 장소 추가 (예: 속초 대포항)"><button class="btn" onclick="addNew()" style="flex:none">추가</button></div></div>`;
const tot=exp.reduce((s,e)=>s+e.a,0),sh=tot/MB.length;
h+=`<div class="card"><h2>💸 경비 정산</h2><div class="row"><select id="pay">${MB.map(m=>`<option>${m}</option>`).join("")}</select><input id="amt" type="number" inputmode="numeric" placeholder="금액(원)"><button class="btn" onclick="addE()" style="flex:none">추가</button></div>`;
h+=exp.length?`<p class="sm">총 ${tot.toLocaleString()}원 · 1인 ${Math.round(sh).toLocaleString()}원</p>`+MB.map(m=>{const p=exp.filter(e=>e.m===m).reduce((s,e)=>s+e.a,0),d=Math.round(p-sh);return `<div class="slot"><span>${m}</span><span class="bal" style="color:${d>=0?"var(--ac)":"var(--warn)"}">${d>=0?"받을 돈":"보낼 돈"} ${Math.abs(d).toLocaleString()}원</span></div>`}).join(""):`<p class="sm">지출을 추가하면 1/N로 자동 정산돼요.</p>`;
h+="</div>";
$("#app").innerHTML=h}
function rm(i,j){plan[i].splice(j,1);render()}
function vt(i){cand[i].v++;render()}
function add(i){const d=+$("#s"+i).value;plan[d].push(cand[i].n);cand.splice(i,1);render()}
function addNew(){const v=$("#np").value.trim();if(v){cand.push({n:v,v:0});render()}}
function addE(){const a=+$("#amt").value,m=$("#pay").value;if(a>0){exp.push({m,a});render()}}
render();
</script>
</body>
</html>
